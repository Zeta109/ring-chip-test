name: Ringtest auf allen Chips
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/ringtest.yml']
permissions:
  contents: write
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04, ubuntu-24.04-arm, ubuntu-22.04-arm, windows-2025, windows-2022, windows-11-arm, macos-15-intel, macos-14, macos-15]
        rep: [1, 2, 3]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python ring_test.py ${{ matrix.os }}_${{ matrix.rep }}
      - uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.os }}-${{ matrix.rep }}
          path: ergebnisse_roh/*.json
  bericht:
    needs: test
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install reportlab
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: ergebnisse_roh
          merge-multiple: true
      - run: python make_report.py
      - uses: actions/upload-artifact@v4
        with:
          name: Messbericht
          path: ergebnisse/
      - name: Ergebnisse ins Repository schreiben
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ergebnisse ergebnisse_roh
          git commit -m "Ergebnisse des Ringtests (Lauf ${{ github.run_id }})"
          git pull --rebase origin main
          git push origin HEAD:main
